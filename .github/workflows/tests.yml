name: tests

on:
  pull_request:
    branches:
      - clean-master

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, tickets, orders, payments, expiration]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Install dependencies & run tests for ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: |
          npm install
          npm run test:ci
        env:
          NODE_ENV: test
